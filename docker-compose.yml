services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: upi
      POSTGRES_PASSWORD: upi
      POSTGRES_DB: upi
    ports:
      - "5432:5432"
    volumes:
      - ./db/create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
